<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LBS Öppet Hus </title>
    <link rel="stylesheet" href="Style.css">
    <!--Google fonts-->
    <!--onest font for: ingress, underubrik och brödtext-->
    <!--bigshoulders font for: headlines-->
    <!--IBM Plex Mono medium-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,800&family=IBM+Plex+Mono:wght@500&family=Onest:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="headContainer">
            <div class="loggo">
                <a href="index.html" class="logo"><img src="lbsLogo.png" alt="lbs logo with text"></a>
            </div>
            <div class="navs">
                <a href="https://lbs.se/lund/"> Om LBS </a>
                <a href="Program.html"> Program</a>
                <a href="index.html">Hem</a>
                <div class="Mapbutton">
                    <a href="karta.html">Karta </a>
                </div>
            </div>
        </div>
    </header>
    <section id="House" >
        <div class="Floors">
            <h5> LBS inifrån </h5>
            <p> våning:</p>
            <button class="floors" data-floor="1"> 1 </button>  <!--Data-floor chat gpt made to be abel to show two diffrent floors -->
            <button class="floors" data-floor="2"> 2 </button>
        </div>                     <!--chat gpt added id floor1 to match the data-floor-->
        <div class="mapContainer" id="floor1"> <!--ihopsättning av stack overflow som chatgpt har förklarat och jag sedan skrivit om så det passar min hemsida och karta-->
            <img src="FirstFloorMap.png"  height="320" width="330px" usemap="#FirstFloorMap" class="FirstFloorMap" alt="karta över våning 1">
            <map name="FirstFloorMap" >
            <area shape="circle" coords="32,43,30" alt="Matsalen" id="Matsalen">
            <area shape="circle" coords="23,108,20" alt="Repstudio" id="Repstudio">
            </map>
            <div id="Matsalentooltip"> 
                <p> MATSALEN: här äter alla elever en jättegod lunch serverad av vår hjälte Marvin</p>
            </div>
            <div id="Repstudiotooltip">
                <p> REPSTUDION: här övar musikarna </p>
            </div>
        </div>
        <div class="mapContainer" id="floor2" hidden> <!--chat gpt added hidden to hide this floor wile floor one is up-->  
            <img src="SecondFloorMap.png" width="330" height="320" usemap="#SecondFloorMap" class="SecondFloorMap" alt="Karta över våning 2">
            <map name="SecondFloorMap">

            </map>
        </div>
    </section>
    <script src="Script.js"></script>
</body>
